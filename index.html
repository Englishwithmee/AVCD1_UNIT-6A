const steps = [
  ['vocabulary','Vocabulary','A small space','Explore the rooms, places, and furniture in a home.'],
  ['vocabulary-practice','Vocabulary Practice','Explore the house','Use the textbook picture to match rooms and furniture.'],
  ['grammar','Grammar','What’s in the room?','Learn to say what is there and where things are.'],
  ['grammar-practice','Grammar Practice','Read a plan. Find the room.','Practice there is, there are, and prepositions of place with the textbook exercises.'],
  ['reading','Reading','24-room micro-apartment','Read about how Gary Chang makes one small apartment work in many different ways.'],
  ['reading-check','Reading Check','How does the apartment work?','Answer five questions about the reading. Check your choices and find the evidence.']
];
const $ = id => document.getElementById(id);
const page = $('page');
const nav = $('nav');
const vocabGroups = Object.keys(vocabulary);
const flatWords = Object.values(vocabulary).flat();
const tasks = {
  rooms:{title:'Exercise 1 · Rooms and places',instruction:'Choose the correct room or place for each number in the picture. Use bathroom twice.',questions:roomQuestions},
  furniture:{title:'Exercise 2 · Furniture and household items',instruction:'Find each item in the picture and choose its letter.',questions:furnitureQuestions},
  ad:grammarSource.exercises[0],
  apartment:grammarSource.exercises[1],
  plan:grammarSource.exercises[2],
  rules:{title:'Exercise 4B · Choose the rule',instruction:'Choose the word that completes each rule from page 49.',questions:grammarSource.book49.questions.slice(4)},
  comprehension:{title:'Exercise 3 · Read and answer',instruction:'Choose the best answer. Check to see feedback and evidence from the article.',questions:readingQuestions},
  textGrammar:{title:'Exercise 4A · Find it in the text',instruction:'Complete the sentences about Gary’s apartment. Use the full forms of the verbs.',questions:grammarSource.book49.questions.slice(0,4)}
};
const states = Object.fromEntries(Object.entries(tasks).map(([id,{questions}])=>[id,{answers:questions.map(()=>''),checked:false,key:false}]));
const translated = reading.map(()=>false);
let stage = 0;
let group = 0;
let wordIndex = 0;
const safe = value => String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const btn = (text,action,style='')=>'<button type="button" class="button '+style+'" data-action="'+action+'">'+text+'</button>';
const card = (title,body)=>'<section class="card"><h2>'+title+'</h2>'+body+'</section>';
const tile = (title,body)=>'<div class="tile"><h3>'+title+'</h3>'+body+'</div>';
function picture(key,caption,alt) {
  return '<figure class="reference '+(key==='roomPlan'?'plan':'')+'"><img src="'+images[key]+'" alt="'+safe(alt)+'"><figcaption>'+safe(caption)+'</figcaption><button type="button" class="button" data-picture="'+key+'">Enlarge picture</button></figure>';
}
const housePicture = () => picture('house','Textbook picture · page 145','Cutaway of a house with room labels 1–14 and furniture labels a–l.');
const floorPlan = () => picture('roomPlan','Textbook floor plan · page 122','A house plan. The living room, kitchen, and dining room are above the hall. Two bedrooms and a bathroom are below it. A small yard borders the street and a large yard with trees is on the opposite side.');
function deck() {
  const words = vocabulary[vocabGroups[group]];
  const selected = words[wordIndex];
  const [name,definition] = selected;
  return '<div class="switcher" role="group" aria-label="Vocabulary category">'+vocabGroups.map((label,i)=>
    '<button type="button" class="choice" data-group="'+i+'" aria-pressed="'+(i===group)+'">'+label+'</button>'
  ).join('')+'</div><article class="study-card"><img src="'+images.cards[flatWords.indexOf(selected)]+'" alt="'+safe(name)+'"><div><span class="pill">WORD '+(wordIndex+1)+' OF '+words.length+'</span><h3>'+safe(name)+'</h3><p>'+safe(definition)+'</p></div></article><div class="deck-actions"><button type="button" class="button" data-action="word-back" '+(wordIndex===0?'disabled':'')+'>← Previous word</button><button type="button" class="button primary" data-action="word-next" '+(wordIndex===words.length-1?'disabled':'')+'>Next word →</button></div><div class="jump-words" role="group" aria-label="Jump to a word">'+words.map(([word],i)=>
    '<button type="button" class="choice" data-word="'+i+'" aria-pressed="'+(wordIndex===i)+'">'+safe(word)+'</button>'
  ).join('')+'</div>';
}
function renderQuiz(id,{select=false,reference='',extra=''}={}) {
  const {title,instruction,questions} = tasks[id];
  const state = states[id];
  const rows = '<div class="questions '+(reference?'compact-questions':'')+'">'+questions.map(({prompt,choices},i)=>{
    const label = id+'-q'+i;
    const answer = state.answers[i];
    const input = select
      ? '<select aria-labelledby="'+label+'" data-item="'+i+'"><option value="">Choose an answer</option>'+choices.map(choice=>'<option value="'+safe(choice)+'" '+(choice===answer?'selected':'')+'>'+safe(choice)+'</option>').join('')+'</select>'
      : '<div class="choices" role="group" aria-labelledby="'+label+'">'+choices.map(choice=>'<button type="button" class="choice" data-item="'+i+'" data-choice="'+safe(choice)+'" aria-pressed="'+(choice===answer)+'">'+safe(choice)+'</button>').join('')+'</div>';
    return '<div class="q"><div class="q-top"><span class="number" aria-hidden="true">'+(i+1)+'</span><p id="'+label+'">'+safe(prompt)+'</p></div>'+input+'<p class="feedback" hidden></p></div>';
  }).join('')+'</div>';
  const body = reference ? '<div class="practice-layout">'+reference+rows+'</div>' : rows;
  return '<section class="quiz" data-quiz="'+id+'"><h2>'+safe(title)+'</h2><p class="description">'+safe(instruction)+'</p>'+extra+body+'<div class="actions">'+btn('Check answers','check','primary')+btn('Show answer key','key')+btn('Reset','reset','quiet')+'</div><p class="score" aria-live="polite" aria-atomic="true"></p></section>';
}
function paintQuiz(section) {
  const id = section.dataset.quiz;
  const {questions} = tasks[id];
  const state = states[id];
  let correct = 0;
  let answered = 0;
  section.querySelectorAll('.q').forEach((row,i)=>{
    const {answer,evidence} = questions[i];
    const choice = state.answers[i];
    const right = choice===answer;
    const feedback = row.querySelector('.feedback');
    correct += Number(right);
    answered += Number(choice!=='');
    row.classList.toggle('good',state.checked && right);
    row.classList.toggle('bad',state.checked && choice!=='' && !right);
    feedback.hidden = !state.key && !(state.checked && choice!=='');
    feedback.textContent = state.key ? 'Answer: '+answer+(evidence?' · '+evidence:'') : right ? 'Correct.'+(evidence?' '+evidence:'') : 'Try again.';
  });
  section.querySelector('.score').textContent = state.checked ? correct+' of '+questions.length+' correct.'+(answered<questions.length?' '+(questions.length-answered)+' unanswered.':'') : '';
  section.querySelector('[data-action="key"]').textContent = state.key?'Hide answer key':'Show answer key';
}
function choose(section,index,value) {
  const state = states[section.dataset.quiz];
  state.answers[index] = value;
  state.checked = false;
  section.querySelectorAll('button[data-item="'+index+'"]').forEach(control=>control.setAttribute('aria-pressed',control.dataset.choice===value));
  paintQuiz(section);
}
function grammarLesson() {
  return card('There is and there are','<p>Use these forms to say that something exists or is in a place.</p><div class="grammar-grid">'+
    tile('One thing · singular','<ul><li><strong>There’s a</strong> sofa in the living room.</li><li><strong>There isn’t a</strong> sofa. / <strong>There’s no</strong> sofa.</li><li><strong>Is there a</strong> sofa? Yes, there is. / No, there isn’t.</li></ul>')+
    tile('More than one · plural','<ul><li><strong>There are some</strong> chairs in the kitchen.</li><li><strong>There aren’t any</strong> chairs. / <strong>There are no</strong> chairs.</li><li><strong>Are there any</strong> chairs? Yes, there are. / No, there aren’t.</li></ul>')+
    '</div><p><strong>Some</strong> is usual in affirmative sentences. <strong>Any</strong> is usual in negative sentences and questions. Use <strong>no</strong> after <em>there is</em> or <em>there are</em> to say that something does not exist.</p>')+
    card('Prepositions of place','<p>Use a preposition to tell someone where a thing or room is.</p><div class="preps">'+prepositions.map(([word,example],i)=>
      '<figure class="prep"><img src="'+images.preps[i]+'" alt=""><figcaption><strong>'+word+'</strong><span>'+example+'</span></figcaption></figure>'
    ).join('')+'</div>');
}
function readingLesson() {
  return card('24-room micro-apartment','<div class="photo-pair"><figure><img src="'+images.bed+'" alt="Gary pulls a bed down from a movable wall."><figcaption>A bed folds down from a wall.</figcaption></figure><figure><img src="'+images.kitchen+'" alt="Gary moves a wall with a TV to reveal the kitchen."><figcaption>The kitchen is behind the TV wall.</figcaption></figure></div><div class="read-controls"><span class="pill alt">READING · PAGE 48</span>'+btn(translated.every(Boolean)?'Hide all translations':'Show all translations','translate-all')+'</div><div class="passage">'+reading.map(({name,en,vi},i)=>
    '<article class="story"><h3>'+(i+1)+'. '+safe(name)+'</h3><p>'+safe(en)+'</p><button type="button" class="button" data-translation="'+i+'" aria-expanded="'+translated[i]+'" aria-controls="translation-'+i+'">'+(translated[i]?'Hide Vietnamese translation':'Show Vietnamese translation')+'</button><div class="translation" id="translation-'+i+'" lang="vi" '+(translated[i]?'':'hidden')+'><p>'+safe(vi)+'</p></div></article>'
  ).join('')+'</div>');
}
function content() {
  switch(steps[stage][0]) {
    case 'vocabulary': return card('Rooms and furniture','<p class="description">Tap a category or a word to see its picture and definition.</p><div id="deck">'+deck()+'</div>');
    case 'vocabulary-practice': return renderQuiz('rooms',{reference:housePicture(),select:true})+renderQuiz('furniture',{reference:housePicture(),select:true});
    case 'grammar': return grammarLesson();
    case 'grammar-practice': return renderQuiz('ad',{extra:'<div class="ad"><strong>Apartment for rent</strong>'+safe(grammarSource.ad)+'</div>'})+
      renderQuiz('apartment')+renderQuiz('plan',{extra:floorPlan()})+renderQuiz('rules');
    case 'reading': return readingLesson();
    case 'reading-check': return card('Need to look back?','<p><a class="button" href="#reading">← Back to the article</a></p>')+renderQuiz('comprehension')+renderQuiz('textGrammar');
  }
}
function render() {
  stage = Math.max(0,steps.findIndex(([id])=>location.hash==='#'+id));
  const [id,label,title,subtitle] = steps[stage];
  nav.innerHTML = steps.map(([slug,name],i)=>'<a class="nav-link" href="#'+slug+'"'+(i===stage?' aria-current="page"':'')+'><span>'+String(i+1).padStart(2,'0')+'</span>'+name+'</a>').join('');
  const cover = id==='vocabulary';
  const hero = '<section class="hero '+(cover?'intro-hero':stage>=4?'accent':'')+'"><div><p class="eyebrow">UNIT 6A · '+label.toUpperCase()+'</p><h1 tabindex="-1">'+title+'</h1><p class="sub">'+subtitle+'</p></div>'+(cover?'<img class="hero-photo" src="'+images.house+'" alt="An illustrated home with rooms on several floors.">':'')+'</section>';
  const back = steps[stage-1], next = steps[stage+1];
  const arrow = (entry,style,prefix,suffix)=>'<a class="button '+style+'" href="#'+entry[0]+'">'+prefix+entry[1]+suffix+'</a>';
  page.innerHTML = hero+content()+'<div class="sequence">'+(back?arrow(back,'','← ',''):'<span></span>')+(next?arrow(next,'primary','',' →'):arrow(steps[0],'primary','Back to ',' ↗'))+'</div>';
  page.querySelectorAll('[data-quiz]').forEach(paintQuiz);
}
function paintTranslations() {
  page.querySelectorAll('[data-translation]').forEach((control,i)=>{
    control.setAttribute('aria-expanded',String(translated[i]));
    control.textContent = translated[i]?'Hide Vietnamese translation':'Show Vietnamese translation';
    $('translation-'+i).hidden = !translated[i];
  });
  page.querySelector('[data-action="translate-all"]').textContent = translated.every(Boolean)?'Hide all translations':'Show all translations';
}
page.addEventListener('change',event=>{
  const target = event.target;
  if(target.matches('select[data-item]')) choose(target.closest('[data-quiz]'),Number(target.dataset.item),target.value);
});
page.addEventListener('click',event=>{
  const target = event.target.closest('button');
  if(!target) return;
  const {action,picture:pictureKey,translation,group:groupKey,word} = target.dataset;
  if(pictureKey) {
    const zoom = $('zoom');
    const img = zoom.querySelector('img');
    img.src = images[pictureKey];
    img.alt = target.closest('figure').querySelector('img').alt;
    zoom.showModal();
    return;
  }
  if(groupKey!==undefined || word!==undefined || action==='word-back' || action==='word-next') {
    if(groupKey!==undefined) {
      group = Number(groupKey);
      wordIndex = 0;
    } else if(word!==undefined) wordIndex = Number(word);
    else wordIndex += action==='word-next'?1:-1;
    const wrapper = $('deck');
    wrapper.innerHTML = deck();
    const attr = groupKey!==undefined?'data-group':word!==undefined?'data-word':'data-action';
    const focus = wrapper.querySelector('['+attr+'="'+(groupKey??word??action)+'"]');
    (focus.disabled?wrapper.querySelector('[data-word="'+wordIndex+'"]'):focus).focus();
    return;
  }
  if(translation!==undefined || action==='translate-all') {
    if(translation!==undefined) translated[Number(translation)] = !translated[Number(translation)];
    else translated.fill(translated.some(value=>!value));
    paintTranslations();
    return;
  }
  const section = target.closest('[data-quiz]');
  if(!section) return;
  if(target.hasAttribute('data-choice')) return choose(section,Number(target.dataset.item),target.dataset.choice);
  const state = states[section.dataset.quiz];
  if(action==='check') state.checked = true;
  if(action==='key') state.key = !state.key;
  if(action==='reset') {
    state.answers.fill('');
    state.checked = false;
    state.key = false;
    section.querySelectorAll('[data-choice]').forEach(control=>control.setAttribute('aria-pressed','false'));
    section.querySelectorAll('select').forEach(control=>control.value='');
  }
  paintQuiz(section);
});
window.addEventListener('hashchange',()=>{
  if(location.hash==='#lesson') return;
  render();
  window.scrollTo(0,0);
  page.querySelector('h1').focus({preventScroll:true});
});
render();
</script>
</body>
</html>
